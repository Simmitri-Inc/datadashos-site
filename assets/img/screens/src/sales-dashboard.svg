<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Sales dashboard">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="48%" stop-color="#122844"/>
      <stop offset="100%" stop-color="#183A63"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C3354"/>
      <stop offset="100%" stop-color="#13263F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="blueV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0C078"/>
      <stop offset="100%" stop-color="#C4A35A"/>
    </linearGradient>
  </defs>


  <rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="210" fill="#3D8BFF" opacity="0.13"/>
  <circle cx="130" cy="920" r="170" fill="#C4A35A" opacity="0.09"/>
  <rect x="36" y="36" width="104" height="928" rx="24" fill="#0A1628"/>
  <circle cx="88" cy="88" r="18" fill="url(#gold)"/>
  <rect x="68" y="142" width="44" height="11" rx="5.5" fill="#3D8BFF"/>
  <rect x="68" y="172" width="44" height="11" rx="5.5" fill="#7A8BA3" opacity="0.5"/>
  <rect x="68" y="202" width="44" height="11" rx="5.5" fill="#7A8BA3" opacity="0.5"/>
  <rect x="68" y="232" width="44" height="11" rx="5.5" fill="#7A8BA3" opacity="0.5"/>
  <rect x="68" y="262" width="44" height="11" rx="5.5" fill="#7A8BA3" opacity="0.5"/>
  <rect x="68" y="910" width="44" height="11" rx="5.5" fill="#C4A35A"/>


  <text x="176" y="86" fill="#F4F7FC" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Sales</text>
  <text x="176" y="120" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="16">Pipeline · win rate · cycle · Sample data</text>
  <rect x="1348" y="62" width="152" height="38" rx="19" fill="rgba(61,139,255,0.16)" stroke="#3D8BFF" stroke-width="1.5"/>
  <text x="1424" y="87" text-anchor="middle" fill="#B8D4FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Sample data</text>


  <rect x="176" y="156" width="400" height="160" rx="22" fill="url(#card)" stroke="rgba(255,255,255,0.1)"/>
  <text x="204" y="198" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Pipeline</text>
  <text x="204" y="254" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800">$1.14M</text>
  <text x="204" y="290" fill="#1D9270" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">▲ 6.1%</text>


  <rect x="600" y="156" width="400" height="160" rx="22" fill="url(#card)" stroke="rgba(255,255,255,0.1)"/>
  <text x="628" y="198" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Win rate</text>
  <text x="628" y="254" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800">31%</text>
  <text x="628" y="290" fill="#C4A35A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">● On target</text>


  <rect x="1024" y="156" width="376" height="160" rx="22" fill="url(#card)" stroke="rgba(255,255,255,0.1)"/>
  <text x="1052" y="198" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Cycle days</text>
  <text x="1052" y="254" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800">24</text>
  <text x="1052" y="290" fill="#1D9270" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">▼ −3 days</text>

<rect x="176" y="348" width="1224" height="560" rx="26" fill="url(#card)" stroke="rgba(224,192,120,0.18)"/>
  <text x="216" y="404" fill="#F4F7FC" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Stage funnel</text>
  <text x="216" y="434" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="14">Deals by stage · current quarter</text>

  <rect x="216" y="480" width="980" height="54" rx="14" fill="url(#blue)" opacity="0.95"/>
  <text x="240" y="514" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Qualified</text>
  <text x="1320" y="514" text-anchor="end" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">42</text>

  <rect x="216" y="552" width="780" height="54" rx="14" fill="url(#blue)" opacity="0.86"/>
  <text x="240" y="586" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Discovery</text>
  <text x="1320" y="586" text-anchor="end" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">31</text>

  <rect x="216" y="624" width="560" height="54" rx="14" fill="url(#blue)" opacity="0.74"/>
  <text x="240" y="658" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Proposal</text>
  <text x="1320" y="658" text-anchor="end" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">18</text>

  <rect x="216" y="696" width="360" height="54" rx="14" fill="url(#blue)" opacity="0.62"/>
  <text x="240" y="730" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Negotiation</text>
  <text x="1320" y="730" text-anchor="end" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">11</text>

  <rect x="216" y="768" width="220" height="54" rx="14" fill="url(#gold)" opacity="1"/>
  <text x="240" y="802" fill="#0B1B33" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Won</text>
  <text x="1320" y="802" text-anchor="end" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">7</text>
</svg>
