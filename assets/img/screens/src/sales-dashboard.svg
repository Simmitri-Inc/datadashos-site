    <text x="512" y="220" fill="#fff" font-size="42" font-weight="800" font-family="Manrope, Arial, sans-serif">31%</text>
    <text x="512" y="252" fill="#C4A35A" font-size="14" font-weight="700" font-family="Manrope, Arial, sans-serif">● On target</text>
    <rect x="832" y="130" width="288" height="150" rx="20" fill="url(#card)"/>
    <text x="856" y="172" fill="#9FB0C8" font-size="14" font-family="Manrope, Arial, sans-serif">Cycle days</text>
