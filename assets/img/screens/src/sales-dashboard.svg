<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="45%" stop-color="#122844"/>
      <stop offset="100%" stop-color="#16375F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3050"/>
      <stop offset="100%" stop-color="#13263F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0C078"/>
      <stop offset="100%" stop-color="#C4A35A"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D9270"/>
      <stop offset="100%" stop-color="#157A5C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D8BFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C4A35A" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="180" fill="url(#glow)"/>
  <circle cx="120" cy="840" r="140" fill="#C4A35A" opacity="0.08"/>
  <rect x="28" y="28" width="88" height="844" rx="20" fill="#0A1628" opacity="0.9"/>
  <circle cx="72" cy="72" r="16" fill="url(#gold)"/>
  <rect x="52" y="118" width="40" height="8" rx="4" fill="#3D8BFF"/>
  <rect x="52" y="144" width="40" height="8" rx="4" fill="#7A8BA3" opacity="0.4"/>
  <rect x="52" y="170" width="40" height="8" rx="4" fill="#7A8BA3" opacity="0.4"/>
  <rect x="52" y="196" width="40" height="8" rx="4" fill="#7A8BA3" opacity="0.4"/>
  <rect x="52" y="222" width="40" height="8" rx="4" fill="#7A8BA3" opacity="0.4"/>
  <rect x="52" y="828" width="40" height="8" rx="4" fill="#C4A35A" opacity="0.85"/>
  <text x="144" y="68" fill="#F4F7FC" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="800">Sales</text>
  <text x="144" y="96" fill="#9FB0C8" font-family="Manrope, Arial, sans-serif" font-size="14">Pipeline · win rate · cycle · Sample data</text>
  <rect x="1030" y="52" width="118" height="32" rx="16" fill="rgba(61,139,255,0.18)" stroke="#3D8BFF" stroke-width="1"/>
  <text x="1048" y="73" fill="#B8D4FF" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700">Sample data</text>

  <g filter="url(#soft)">
    <rect x="144" y="130" width="320" height="150" rx="20" fill="url(#card)"/>
    <text x="168" y="172" fill="#9FB0C8" font-size="14" font-family="Manrope, Arial, sans-serif">Pipeline</text>
    <text x="168" y="220" fill="#fff" font-size="42" font-weight="800" font-family="Manrope, Arial, sans-serif">$1.14M</text>
    <text x="168" y="252" fill="#1D9270" font-size="14" font-weight="700" font-family="Manrope, Arial, sans-serif">▲ 6.1%</text>
    <rect x="488" y="130" width="320" height="150" rx="20" fill="url(#card)"/>
