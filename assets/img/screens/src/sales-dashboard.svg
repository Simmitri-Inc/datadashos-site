    <text x="856" y="252" fill="#1D9270" font-size="14" font-weight="700" font-family="Manrope, Arial, sans-serif">▼ −3 days</text>
  </g>
  <rect x="144" y="320" width="976" height="480" rx="24" fill="url(#card)" filter="url(#soft)"/>
  <text x="176" y="364" fill="#F4F7FC" font-size="18" font-weight="700" font-family="Manrope, Arial, sans-serif">Stage funnel</text>
<rect x="176" y="400" width="820" height="44" rx="12" fill="url(#blue)" opacity="0.95"/><text x="196" y="428" fill="#fff" font-size="15" font-weight="700" font-family="Manrope, Arial, sans-serif">Qualified</text><rect x="176" y="470" width="640" height="44" rx="12" fill="url(#blue)" opacity="0.83"/><text x="196" y="498" fill="#fff" font-size="15" font-weight="700" font-family="Manrope, Arial, sans-serif">Discovery</text><rect x="176" y="540" width="420" height="44" rx="12" fill="url(#blue)" opacity="0.71"/><text x="196" y="568" fill="#fff" font-size="15" font-weight="700" font-family="Manrope, Arial, sans-serif">Proposal</text><rect x="176" y="610" width="260" height="44" rx="12" fill="url(#blue)" opacity="0.59"/><text x="196" y="638" fill="#fff" font-size="15" font-weight="700" font-family="Manrope, Arial, sans-serif">Negotiation</text><rect x="176" y="680" width="160" height="44" rx="12" fill="url(#blue)" opacity="0.47"/><text x="196" y="708" fill="#fff" font-size="15" font-weight="700" font-family="Manrope, Arial, sans-serif">Won</text></svg>