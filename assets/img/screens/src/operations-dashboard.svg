<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Operations dashboard sample">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="50%" stop-color="#122844"/>
      <stop offset="100%" stop-color="#16375F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3050"/>
      <stop offset="100%" stop-color="#13263F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0C078"/>
      <stop offset="100%" stop-color="#C4A35A"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
  <circle cx="1420" cy="90" r="220" fill="#3D8BFF" opacity="0.14"/>
  <circle cx="140" cy="920" r="180" fill="#C4A35A" opacity="0.08"/>

  <rect x="36" y="36" width="100" height="928" rx="22" fill="#0A1628"/>
  <circle cx="86" cy="86" r="18" fill="url(#gold)"/>
  <rect x="66" y="140" width="40" height="10" rx="5" fill="#3D8BFF"/>
  <rect x="66" y="170" width="40" height="10" rx="5" fill="#7A8BA3" opacity="0.45"/>
  <rect x="66" y="200" width="40" height="10" rx="5" fill="#7A8BA3" opacity="0.45"/>
  <rect x="66" y="230" width="40" height="10" rx="5" fill="#7A8BA3" opacity="0.45"/>
  <rect x="66" y="260" width="40" height="10" rx="5" fill="#7A8BA3" opacity="0.45"/>
  <rect x="66" y="910" width="40" height="10" rx="5" fill="#C4A35A"/>

  <text x="176" y="88" fill="#F4F7FC" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Operations</text>
  <text x="176" y="122" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="16">Throughput · quality · capacity · Sample data</text>
  <rect x="1360" y="64" width="140" height="36" rx="18" fill="rgba(61,139,255,0.16)" stroke="#3D8BFF" stroke-width="1.5"/>
  <text x="1430" y="88" text-anchor="middle" fill="#B8D4FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Sample data</text>

  <g filter="url(#cardShadow)">
    <rect x="176" y="160" width="400" height="168" rx="22" fill="url(#card)"/>
    <rect x="600" y="160" width="400" height="168" rx="22" fill="url(#card)"/>
    <rect x="1024" y="160" width="376" height="168" rx="22" fill="url(#card)"/>
  </g>
  <text x="204" y="210" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">On-time delivery</text>
  <text x="204" y="268" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">94%</text>
  <text x="204" y="302" fill="#1D9270" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">▲ +1.2 pts</text>

  <text x="628" y="210" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">Open issues</text>
  <text x="628" y="268" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">7</text>
  <text x="628" y="302" fill="#C4A35A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">2 need owner</text>

  <text x="1052" y="210" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">Utilization</text>
  <text x="1052" y="268" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">81%</text>
  <text x="1052" y="302" fill="#1D9270" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">● Balanced</text>

  <g filter="url(#cardShadow)">
    <rect x="176" y="360" width="1224" height="560" rx="26" fill="url(#card)"/>
  </g>
  <text x="216" y="416" fill="#F4F7FC" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Weekly capacity</text>
  <text x="216" y="448" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="14">Jobs completed vs planned capacity</text>

  <!-- Baseline -->
  <line x1="240" y1="820" x2="1320" y2="820" stroke="#2A3F5F" stroke-width="2"/>

  <!-- Bars Mon-Sun + this week -->
  <rect x="260" y="620" width="80" height="200" rx="14" fill="url(#blue)" opacity="0.7"/>
  <rect x="380" y="560" width="80" height="260" rx="14" fill="url(#blue)" opacity="0.8"/>
  <rect x="500" y="640" width="80" height="180" rx="14" fill="url(#blue)" opacity="0.7"/>
  <rect x="620" y="500" width="80" height="320" rx="14" fill="url(#blue)"/>
  <rect x="740" y="580" width="80" height="240" rx="14" fill="url(#blue)" opacity="0.85"/>
  <rect x="860" y="520" width="80" height="300" rx="14" fill="url(#blue)"/>
  <rect x="980" y="650" width="80" height="170" rx="14" fill="url(#blue)" opacity="0.65"/>
  <rect x="1100" y="590" width="80" height="230" rx="14" fill="url(#gold)" opacity="0.9"/>

  <text x="300" y="852" text-anchor="middle" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Mon</text>
  <text x="420" y="852" text-anchor="middle" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Tue</text>
  <text x="540" y="852" text-anchor="middle" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Wed</text>
  <text x="660" y="852" text-anchor="middle" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Thu</text>
  <text x="780" y="852" text-anchor="middle" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Fri</text>
  <text x="900" y="852" text-anchor="middle" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Sat</text>
  <text x="1020" y="852" text-anchor="middle" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Sun</text>
  <text x="1140" y="852" text-anchor="middle" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Plan</text>
</svg>
