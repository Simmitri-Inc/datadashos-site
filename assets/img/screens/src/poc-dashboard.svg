  <text x="204" y="290" fill="#1D9270" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">▲ 12.4% vs prior</text>


  <rect x="496" y="156" width="300" height="150" rx="22" fill="url(#card)" stroke="rgba(255,255,255,0.1)"/>
