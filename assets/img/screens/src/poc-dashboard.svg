  <text x="1112" y="486" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Owner · Sales lead</text>
  <rect x="1092" y="528" width="276" height="78" rx="14" fill="#0F2036" stroke="#2A3F5F"/>
  <text x="1112" y="560" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Protect margin</text>
  <text x="1112" y="584" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Owner · Ops</text>
  <rect x="1092" y="626" width="276" height="78" rx="14" fill="#0F2036" stroke="#2A3F5F"/>
  <text x="1112" y="658" fill="#B8D4FF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Cash review Friday</text>
  <text x="1112" y="682" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Owner · Finance</text>
  <rect x="1092" y="740" width="276" height="52" rx="14" fill="url(#gold)"/>
  <text x="1230" y="773" text-anchor="middle" fill="#0B1B33" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Open weekly review</text>
