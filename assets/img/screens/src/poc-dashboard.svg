  <rect x="1060" y="336" width="340" height="68" rx="26" fill="#102038"/>
  <rect x="1060" y="380" width="340" height="24" fill="#102038"/>
  <text x="1092" y="382" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Owners &amp; actions</text>
  <rect x="1092" y="430" width="276" height="78" rx="14" fill="#0F2036" stroke="#2A3F5F"/>
