  <text x="1164" y="290" fill="#1D9270" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">▲ Healthy</text>

<rect x="176" y="336" width="860" height="560" rx="26" fill="url(#card)" stroke="rgba(224,192,120,0.18)"/>
<rect x="1060" y="336" width="340" height="560" rx="26" fill="url(#card)" stroke="rgba(224,192,120,0.18)"/>
