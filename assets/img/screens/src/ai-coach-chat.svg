  <text x="200" y="530" fill="#B8D4FF" font-size="15" font-weight="700" font-family="Manrope, Arial, sans-serif">You</text>
  <text x="200" y="560" fill="#E8EEF8" font-size="16" font-family="Manrope, Arial, sans-serif">Turn that into an owned action.</text>
  <rect x="176" y="650" width="836" height="100" rx="18" fill="#0A1628" stroke="#C4A35A" stroke-opacity="0.5"/>
  <text x="208" y="710" fill="#9FB0C8" font-size="16" font-family="Manrope, Arial, sans-serif">Ask about revenue, margin, pipeline…</text>
  <rect x="900" y="672" width="80" height="56" rx="14" fill="url(#gold)"/>
  <text x="924" y="708" fill="#0B1B33" font-size="18" font-weight="800" font-family="Manrope, Arial, sans-serif">→</text>
