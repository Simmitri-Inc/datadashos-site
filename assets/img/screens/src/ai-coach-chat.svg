  <text x="344" y="360" fill="#E8EEF8" font-size="16" font-family="Manrope, Arial, sans-serif">Win rate fell 2.1 pts. Discovery→proposal conversion</text>
  <text x="344" y="386" fill="#E8EEF8" font-size="16" font-family="Manrope, Arial, sans-serif">dropped after average cycle days rose to 27.</text>
  <text x="344" y="420" fill="#9FB0C8" font-size="15" font-family="Manrope, Arial, sans-serif">Recommend: tighten proposal SLA to 48 hours.</text>
