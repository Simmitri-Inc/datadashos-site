<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="45%" stop-color="#122844"/>
      <stop offset="100%" stop-color="#16375F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3050"/>
      <stop offset="100%" stop-color="#13263F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0C078"/>
      <stop offset="100%" stop-color="#C4A35A"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D9270"/>
      <stop offset="100%" stop-color="#157A5C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D8BFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C4A35A" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
