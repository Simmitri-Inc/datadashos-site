<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Marketing dashboard sample">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="50%" stop-color="#122844"/>
      <stop offset="100%" stop-color="#16375F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3050"/>
      <stop offset="100%" stop-color="#13263F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0C078"/>
      <stop offset="100%" stop-color="#C4A35A"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
  <circle cx="1420" cy="90" r="220" fill="#3D8BFF" opacity="0.14"/>
  <circle cx="140" cy="920" r="180" fill="#C4A35A" opacity="0.08"/>

  <!-- Sidebar -->
  <rect x="36" y="36" width="100" height="928" rx="22" fill="#0A1628"/>
  <circle cx="86" cy="86" r="18" fill="url(#gold)"/>
  <rect x="66" y="140" width="40" height="10" rx="5" fill="#3D8BFF"/>
  <rect x="66" y="170" width="40" height="10" rx="5" fill="#7A8BA3" opacity="0.45"/>
  <rect x="66" y="200" width="40" height="10" rx="5" fill="#7A8BA3" opacity="0.45"/>
  <rect x="66" y="230" width="40" height="10" rx="5" fill="#7A8BA3" opacity="0.45"/>
  <rect x="66" y="260" width="40" height="10" rx="5" fill="#7A8BA3" opacity="0.45"/>
  <rect x="66" y="910" width="40" height="10" rx="5" fill="#C4A35A"/>

  <!-- Header -->
  <text x="176" y="88" fill="#F4F7FC" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Marketing</text>
  <text x="176" y="122" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="16">Traffic · conversion · spend · Sample data</text>
  <rect x="1360" y="64" width="140" height="36" rx="18" fill="rgba(61,139,255,0.16)" stroke="#3D8BFF" stroke-width="1.5"/>
  <text x="1430" y="88" text-anchor="middle" fill="#B8D4FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Sample data</text>

  <!-- KPI cards -->
  <g filter="url(#cardShadow)">
    <rect x="176" y="160" width="400" height="168" rx="22" fill="url(#card)"/>
    <rect x="600" y="160" width="400" height="168" rx="22" fill="url(#card)"/>
    <rect x="1024" y="160" width="376" height="168" rx="22" fill="url(#card)"/>
  </g>
  <text x="204" y="210" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">Sessions</text>
  <text x="204" y="268" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">48.2k</text>
  <text x="204" y="302" fill="#1D9270" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">▲ 8.4%</text>

  <text x="628" y="210" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">Conversion</text>
  <text x="628" y="268" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">3.8%</text>
  <text x="628" y="302" fill="#C4A35A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">● Target 4.0%</text>

  <text x="1052" y="210" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">CAC</text>
  <text x="1052" y="268" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">$86</text>
  <text x="1052" y="302" fill="#1D9270" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">▼ −6%</text>

  <!-- Campaign performance -->
  <g filter="url(#cardShadow)">
    <rect x="176" y="360" width="1224" height="560" rx="26" fill="url(#card)"/>
  </g>
  <text x="216" y="416" fill="#F4F7FC" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Campaign performance</text>

  <!-- Row 1 -->
  <text x="216" y="470" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">Brand search</text>
  <text x="1320" y="470" text-anchor="end" fill="#E8EEF8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">$42.1k</text>
  <rect x="216" y="486" width="1104" height="22" rx="11" fill="#0F2036"/>
  <rect x="216" y="486" width="720" height="22" rx="11" fill="url(#blue)"/>

  <!-- Row 2 -->
  <text x="216" y="560" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">Retargeting</text>
  <text x="1320" y="560" text-anchor="end" fill="#E8EEF8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">$28.4k</text>
  <rect x="216" y="576" width="1104" height="22" rx="11" fill="#0F2036"/>
  <rect x="216" y="576" width="520" height="22" rx="11" fill="url(#gold)"/>

  <!-- Row 3 -->
  <text x="216" y="650" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">Content</text>
  <text x="1320" y="650" text-anchor="end" fill="#E8EEF8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">$16.8k</text>
  <rect x="216" y="666" width="1104" height="22" rx="11" fill="#0F2036"/>
  <rect x="216" y="666" width="380" height="22" rx="11" fill="#1D9270"/>

  <!-- Row 4 -->
  <text x="216" y="740" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="15">Partners</text>
  <text x="1320" y="740" text-anchor="end" fill="#E8EEF8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">$9.2k</text>
  <rect x="216" y="756" width="1104" height="22" rx="11" fill="#0F2036"/>
  <rect x="216" y="756" width="260" height="22" rx="11" fill="#2F6BFF"/>

  <text x="216" y="850" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="14">Spend vs plan this week · brand and retargeting leading</text>
</svg>
