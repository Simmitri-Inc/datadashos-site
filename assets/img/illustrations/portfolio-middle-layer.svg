<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DataDashOS as the middle layer across portfolio companies</title>
  <desc id="desc">Holding company scorecard above DataDashOS, which connects to a manufacturer, distributor, and services firm each keeping their own systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="55%" stop-color="#122844"/>
      <stop offset="100%" stop-color="#16375F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0C078"/>
      <stop offset="100%" stop-color="#C4A35A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3050"/>
      <stop offset="100%" stop-color="#13263F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="160" fill="#3D8BFF" opacity="0.12"/>
  <circle cx="120" cy="640" r="140" fill="#C4A35A" opacity="0.08"/>

  <!-- Holding / parent -->
  <g filter="url(#soft)">
    <rect x="360" y="36" width="480" height="88" rx="18" fill="url(#card)" stroke="rgba(224,192,120,0.45)" stroke-width="1.5"/>
  </g>
  <text x="600" y="72" text-anchor="middle" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.08em">HOLDING COMPANY</text>
  <text x="600" y="100" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">One consolidated KPI view</text>

  <!-- Connectors parent -> hub -->
  <path d="M600 124 V168" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- DataDashOS hub -->
  <g filter="url(#soft)">
    <rect x="300" y="168" width="600" height="120" rx="22" fill="url(#blue)"/>
  </g>
  <text x="600" y="218" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">DataDashOS</text>
  <text x="600" y="252" text-anchor="middle" fill="#D6E6FF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Middle layer · shared KPIs · owners &amp; actions</text>

  <!-- Spokes to companies -->
  <path d="M420 288 C420 340, 220 340, 220 390" fill="none" stroke="#E0C078" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M600 288 V390" fill="none" stroke="#E0C078" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M780 288 C780 340, 980 340, 980 390" fill="none" stroke="#E0C078" stroke-width="2" stroke-dasharray="5 6"/>

  <!-- Company cards -->
  <g filter="url(#soft)">
    <rect x="70" y="400" width="300" height="250" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="450" y="400" width="300" height="250" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="830" y="400" width="300" height="250" rx="20" fill="url(#card)" stroke="rgba(255,255,255,0.12)"/>
  </g>

  <!-- Manufacturer -->
  <circle cx="120" cy="448" r="16" fill="url(#gold)"/>
  <text x="152" y="454" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Manufacturer</text>
  <text x="100" y="500" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="14">Keeps its ERP</text>
  <rect x="100" y="520" width="240" height="36" rx="10" fill="#0F2036" stroke="#2A3F5F"/>
  <text x="220" y="544" text-anchor="middle" fill="#B8D4FF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Plant system · OEE · scrap</text>
  <rect x="100" y="570" width="240" height="36" rx="10" fill="#0F2036" stroke="#2A3F5F"/>
  <text x="220" y="594" text-anchor="middle" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">KPIs → DataDashOS</text>

  <!-- Distributor -->
  <circle cx="500" cy="448" r="16" fill="url(#gold)"/>
  <text x="532" y="454" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Distributor</text>
  <text x="480" y="500" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="14">Keeps its WMS / CRM</text>
  <rect x="480" y="520" width="240" height="36" rx="10" fill="#0F2036" stroke="#2A3F5F"/>
  <text x="600" y="544" text-anchor="middle" fill="#B8D4FF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Fill rate · turns · OTIF</text>
  <rect x="480" y="570" width="240" height="36" rx="10" fill="#0F2036" stroke="#2A3F5F"/>
  <text x="600" y="594" text-anchor="middle" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">KPIs → DataDashOS</text>

  <!-- Services -->
  <circle cx="880" cy="448" r="16" fill="url(#gold)"/>
  <text x="912" y="454" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Services firm</text>
  <text x="860" y="500" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="14">Keeps its PSA / finance</text>
  <rect x="860" y="520" width="240" height="36" rx="10" fill="#0F2036" stroke="#2A3F5F"/>
  <text x="980" y="544" text-anchor="middle" fill="#B8D4FF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Utilization · backlog</text>
  <rect x="860" y="570" width="240" height="36" rx="10" fill="#0F2036" stroke="#2A3F5F"/>
  <text x="980" y="594" text-anchor="middle" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">KPIs → DataDashOS</text>

  <text x="600" y="690" text-anchor="middle" fill="#9FB0C8" font-family="Inter, Arial, sans-serif" font-size="13">Same pattern in a merger: both sides keep their tools · leadership tracks combined progress</text>
</svg>
