<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="rhythmTitle rhythmDesc">
  <title id="rhythmTitle">KPI operating rhythm</title>
  <desc id="rhythmDesc">Four connected steps in a closed loop: Define, Track, Manage, Adapt.</desc>
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0C078"/>
      <stop offset="100%" stop-color="#C4A35A"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3050"/>
      <stop offset="100%" stop-color="#12263F"/>
    </linearGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L9 5 L0 8.5 Z" fill="#E0C078"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L9 5 L0 8.5 Z" fill="#3D8BFF"/>
    </marker>
  </defs>

  <!-- Cards only — no drop-shadow on text -->
  <rect x="48" y="56" width="220" height="168" rx="22" fill="url(#gCard)" stroke="#E0C078" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="342" y="56" width="220" height="168" rx="22" fill="url(#gCard)" stroke="#3D8BFF" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="636" y="56" width="220" height="168" rx="22" fill="url(#gCard)" stroke="#3D8BFF" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="930" y="56" width="220" height="168" rx="22" fill="url(#gCard)" stroke="#E0C078" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Forward connectors: card edge → card edge -->
  <path d="M268 140 H334" fill="none" stroke="url(#gBlue)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M562 140 H628" fill="none" stroke="url(#gBlue)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <path d="M856 140 H922" fill="none" stroke="url(#gBlue)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Return loop: Adapt bottom → under row → Define bottom (fully connected) -->
  <path d="M1040 224 V300 H158 V224" fill="none" stroke="url(#gGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGold)"/>

  <!-- Define -->
  <circle cx="158" cy="108" r="24" fill="url(#gGold)"/>
  <text x="158" y="114" text-anchor="middle" fill="#0B1B33" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">01</text>
  <text x="158" y="158" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Define</text>
  <text x="158" y="186" text-anchor="middle" fill="#B8C6DA" font-family="Inter, Arial, sans-serif" font-size="14">KPIs &amp; owners</text>

  <!-- Track -->
  <circle cx="452" cy="108" r="24" fill="url(#gBlue)"/>
  <text x="452" y="114" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">02</text>
  <text x="452" y="158" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Track</text>
  <text x="452" y="186" text-anchor="middle" fill="#B8C6DA" font-family="Inter, Arial, sans-serif" font-size="14">One scorecard</text>

  <!-- Manage -->
  <circle cx="746" cy="108" r="24" fill="url(#gBlue)"/>
  <text x="746" y="114" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">03</text>
  <text x="746" y="158" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Manage</text>
  <text x="746" y="186" text-anchor="middle" fill="#B8C6DA" font-family="Inter, Arial, sans-serif" font-size="14">Review → action</text>

  <!-- Adapt -->
  <circle cx="1040" cy="108" r="24" fill="url(#gGold)"/>
  <text x="1040" y="114" text-anchor="middle" fill="#0B1B33" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">04</text>
  <text x="1040" y="158" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Adapt</text>
  <text x="1040" y="186" text-anchor="middle" fill="#B8C6DA" font-family="Inter, Arial, sans-serif" font-size="14">Grow the KPIs</text>

  <text x="600" y="300" text-anchor="middle" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.04em">LOOP CONTINUES</text>
  <text x="600" y="370" text-anchor="middle" fill="#E0C078" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">KPIs first. Everything else follows.</text>
</svg>
